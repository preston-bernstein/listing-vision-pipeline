name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: preston-bernstein/ci-workflows/.github/workflows/node.yml@v1
    with:
      node-versions: '["22"]'
      # check:secrets scans history, so it needs more than a shallow clone.
      fetch-depth: 0
      lint: npm run lint
      typecheck: npm run typecheck
      test: npm run test
      checks: |
        npm run check:secrets

  workflows:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@v1
